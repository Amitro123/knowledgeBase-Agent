name: Sync Google Sheets → resources.json + graph.json

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:         # manual trigger from Actions tab
  push:                      # regenerate right away when the sync/graph code changes
    branches: [main]
    paths:
      - scripts/sync_sheets.py
      - scripts/build_graph.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-sheets.txt

      - name: Run sync script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_sheets.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.json data/graph.json data/first_seen.json
          if git diff --cached --quiet; then
            echo "No changes to resources.json / graph.json — skipping commit."
          else
            git commit -m "chore: sync resources.json and graph.json from Google Sheets"
            git push
          fi
