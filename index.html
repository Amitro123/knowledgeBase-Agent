<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מאגר ידע AI — Amitro</title>
  <meta name="description" content="מאגר קישורי AI אישי — כלים, מחקר, מדריכים ועוד, מעובד ומועשר בעזרת Claude." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    /* ── Reset & Tokens ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f17;
      --bg2:         #13161f;
      --bg3:         #1a1e2e;
      --surface:     #1e2235;
      --surface2:    #252a3d;
      --border:      #2d3352;
      --border-hover:#4a5280;
      --text:        #e8eaf6;
      --text-dim:    #8892b0;
      --text-dimmer: #4a5568;
      --accent:      #7c6af7;
      --accent2:     #5b8dee;
      --accent3:     #f97a6c;
      --green:       #52d9a0;
      --yellow:      #f7c948;
      --radius:      12px;
      --radius-sm:   8px;
      --shadow:      0 4px 24px rgba(0,0,0,.45);
      --glow:        0 0 24px rgba(124,106,247,.18);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Heebo', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background mesh ─────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 10% 10%, rgba(124,106,247,.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(91,141,238,.07) 0%, transparent 55%);
    }

    /* ── Layout ──────────────────────────────────────────────────────── */
    .wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ── Header ──────────────────────────────────────────────────────── */
    header {
      padding: 56px 0 40px;
      border-bottom: 1px solid var(--border);
    }

    .header-inner { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 20px; }

    .logo {
      display: flex; align-items: center; gap: 14px;
    }

    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; box-shadow: var(--glow);
    }

    .logo-text h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; }
    .logo-text p  { font-size: .85rem; color: var(--text-dim); margin-top: 2px; }

    .header-stats {
      display: flex; gap: 24px;
    }

    .stat {
      text-align: center;
    }

    .stat-num {
      font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label { font-size: .75rem; color: var(--text-dim); margin-top: 2px; }

    /* ── Controls ────────────────────────────────────────────────────── */
    .controls {
      padding: 28px 0 20px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }

    .search-wrap {
      flex: 1 1 280px; position: relative;
    }

    #search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 44px 12px 16px;
      border-radius: var(--radius-sm);
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #search-input::placeholder { color: var(--text-dimmer); }
    #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,247,.15); }

    .search-icon {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-dim); pointer-events: none; font-size: 16px;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: .82rem;
      font-family: inherit;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }

    .filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ── Sort & count ────────────────────────────────────────────────── */
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 16px;
      font-size: .84rem; color: var(--text-dim);
    }

    #results-count { }

    #sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px; border-radius: var(--radius-sm);
      font-size: .84rem; font-family: inherit; outline: none;
      cursor: pointer;
    }

    /* ── Grid ────────────────────────────────────────────────────────── */
    #cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding-bottom: 60px;
    }

    /* ── Card ────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex; flex-direction: column; gap: 12px;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute; top: 0; right: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0;
      transition: opacity .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow), var(--glow);
      border-color: var(--border-hover);
    }

    .card:hover::before { opacity: 1; }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

    .card-title {
      font-size: .98rem; font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .category-badge {
      flex-shrink: 0;
      font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      padding: 3px 9px; border-radius: 999px;
    }

    .category-badge.tutorial   { background: rgba(82,217,160,.15); color: var(--green); }
    .category-badge.tool       { background: rgba(124,106,247,.18); color: var(--accent); }
    .category-badge.research   { background: rgba(91,141,238,.18); color: var(--accent2); }
    .category-badge.news       { background: rgba(247,201,72,.12); color: var(--yellow); }
    .category-badge.reference  { background: rgba(249,122,108,.12); color: var(--accent3); }
    .category-badge.community  { background: rgba(82,217,160,.12); color: var(--green); }
    .category-badge.other      { background: rgba(255,255,255,.06); color: var(--text-dim); }
    .category-badge.uncategorised { background: rgba(255,255,255,.06); color: var(--text-dim); }

    .card-summary {
      font-size: .86rem; color: var(--text-dim); line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto;
    }

    .tag {
      font-size: .72rem; padding: 3px 9px; border-radius: 999px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim);
      transition: all .15s;
    }

    .card:hover .tag { border-color: var(--border-hover); color: var(--text); }

    .card-notes {
      font-size: .8rem; color: var(--text-dim); line-height: 1.5;
      background: var(--bg3); border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      border-right: 3px solid var(--accent);
    }

    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .75rem; color: var(--text-dimmer);
      border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px;
    }

    .card-url {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 65%;
      color: var(--accent2); opacity: .75;
    }

    /* ── Empty state ─────────────────────────────────────────────────── */
    #empty-state {
      display: none; flex-direction: column; align-items: center;
      gap: 16px; padding: 80px 0; text-align: center;
      color: var(--text-dim);
    }

    #empty-state .empty-icon { font-size: 3rem; }
    #empty-state h3 { font-size: 1.1rem; color: var(--text); }
    #empty-state p  { font-size: .88rem; max-width: 320px; }

    /* ── Loading ─────────────────────────────────────────────────────── */
    #loading {
      display: flex; justify-content: center; padding: 60px 0;
    }

    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ──────────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      text-align: center;
      font-size: .78rem;
      color: var(--text-dimmer);
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Responsive ──────────────────────────────────────────────────── */
    /* ── View toggle ─────────────────────────────────────────────────── */
    .view-toggle {
      display: flex; gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .view-btn {
      padding: 7px 18px;
      border: none; border-radius: 6px;
      background: transparent;
      color: var(--text-dim);
      font-size: .84rem; font-family: inherit;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }

    .view-btn:hover { color: var(--text); }
    .view-btn.active {
      background: var(--accent);
      color: #fff; font-weight: 600;
    }

    /* ── Graph container ─────────────────────────────────────────────── */
    #graph-wrapper {
      display: none;
      width: 100%;
      height: 75vh;
      min-height: 450px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg2);
      position: relative;
    }

    #graph-container {
      width: 100%; height: 100%;
      border-radius: var(--radius);
    }

    #graph-container canvas { border-radius: var(--radius); }

    /* ── Graph legend ────────────────────────────────────────────────── */
    .graph-legend {
      position: absolute; top: 12px; left: 12px; z-index: 5;
      background: rgba(13,15,23,.92);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
      font-size: .76rem; color: var(--text-dim);
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    .legend-item {
      display: flex; align-items: center; gap: 8px;
    }

    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.diamond {
      border-radius: 2px;
      transform: rotate(45deg);
      width: 11px; height: 11px;
    }

    /* ── Graph hover tooltip ─────────────────────────────────────────── */
    #graph-tooltip {
      display: none;
      position: fixed;
      z-index: 50;
      max-width: 340px;
      background: rgba(13,15,23,.95);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: .82rem;
      color: var(--text);
      pointer-events: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      line-height: 1.5;
      direction: rtl;
    }

    #graph-tooltip .tt-type {
      font-size: .66rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em;
      padding: 2px 7px; border-radius: 999px;
      display: inline-block; margin-bottom: 6px;
    }

    #graph-tooltip .tt-type.resource { background: rgba(124,106,247,.2); color: var(--accent); }
    #graph-tooltip .tt-type.tag      { background: rgba(91,141,238,.2); color: var(--accent2); }
    #graph-tooltip .tt-type.category { background: rgba(82,217,160,.18); color: var(--green); }

    #graph-tooltip .tt-title {
      font-weight: 600; font-size: .9rem; margin-bottom: 4px;
    }

    #graph-tooltip .tt-summary {
      color: var(--text-dim); font-size: .78rem;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    #graph-tooltip .tt-tags {
      margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px;
    }

    #graph-tooltip .tt-tags span {
      font-size: .68rem; padding: 1px 7px; border-radius: 999px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim);
    }

    #graph-tooltip .tt-count {
      color: var(--text-dim); font-size: .78rem; margin-top: 2px;
    }

    /* ── Graph zoom hint ─────────────────────────────────────────────── */
    .graph-zoom-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 5;
      background: rgba(13,15,23,.8);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: .72rem; color: var(--text-dimmer);
      pointer-events: none;
      transition: opacity .4s;
    }

    /* ── Detail panel (graph) ────────────────────────────────────────── */
    #graph-detail {
      display: none;
      position: absolute; top: 12px; right: 12px; z-index: 10;
      width: 340px; max-width: calc(100% - 24px);
      max-height: calc(100% - 24px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    #graph-detail .detail-close {
      position: absolute; top: 10px; left: 10px;
      background: none; border: none;
      color: var(--text-dim); font-size: 1.1rem;
      cursor: pointer; line-height: 1;
    }

    #graph-detail .detail-close:hover { color: var(--text); }

    #graph-detail .detail-type {
      font-size: .7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em;
      padding: 2px 8px; border-radius: 999px;
      display: inline-block; margin-bottom: 8px;
    }

    #graph-detail .detail-type.resource { background: rgba(124,106,247,.18); color: var(--accent); }
    #graph-detail .detail-type.tag      { background: rgba(91,141,238,.18); color: var(--accent2); }
    #graph-detail .detail-type.category { background: rgba(82,217,160,.15); color: var(--green); }

    #graph-detail h3 {
      font-size: 1.05rem; font-weight: 600; margin-bottom: 8px;
      line-height: 1.4;
    }

    #graph-detail .detail-summary {
      font-size: .86rem; color: var(--text-dim); line-height: 1.55;
      margin-bottom: 10px;
    }

    #graph-detail .detail-notes {
      font-size: .8rem; color: var(--text-dim); line-height: 1.5;
      background: var(--bg3); border-radius: var(--radius-sm);
      padding: 8px 12px; margin-bottom: 10px;
      border-right: 3px solid var(--accent);
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    #graph-detail .detail-meta {
      font-size: .78rem; color: var(--text-dimmer);
      margin-bottom: 6px;
    }

    #graph-detail .detail-tags {
      display: flex; flex-wrap: wrap; gap: 5px;
      margin: 8px 0;
    }

    #graph-detail .detail-tags .tag {
      font-size: .72rem; padding: 3px 9px; border-radius: 999px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim);
    }

    #graph-detail .detail-link {
      display: inline-block; margin-top: 10px;
      padding: 8px 18px; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff;
      text-decoration: none; font-size: .84rem; font-weight: 500;
      transition: opacity .15s;
    }

    #graph-detail .detail-link:hover { opacity: .85; }

    /* ── Mobile bottom-sheet drag handle ────────────────────────────── */
    .detail-drag-handle {
      display: none;
    }

    @media (max-width: 600px) {
      .detail-drag-handle {
        display: block;
        width: 36px; height: 4px;
        background: var(--text-dimmer);
        border-radius: 2px;
        margin: 0 auto 10px;
      }
    }

    /* ── Graph hint overlay ──────────────────────────────────────────── */
    .graph-hint {
      position: absolute; bottom: 54px; right: 14px; z-index: 5;
      background: rgba(13,15,23,.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: .76rem; color: var(--text-dim);
      pointer-events: none;
      transition: opacity .4s;
    }

    /* ── Graph mode toggle (Hubs / All) ──────────────────────────────── */
    .graph-mode-toggle {
      position: absolute; bottom: 16px; right: 14px;
      z-index: 6;
      display: none; gap: 2px;
      background: rgba(30,34,53,.95);
      border: 1px solid var(--border-hover);
      border-radius: 999px;
      padding: 3px;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0,0,0,.5), 0 0 0 1px rgba(124,106,247,.12);
    }

    .graph-mode-btn {
      padding: 6px 18px;
      border: none; border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-size: .8rem; font-family: inherit;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
      font-weight: 500;
    }

    .graph-mode-btn:hover { color: #fff; background: rgba(124,106,247,.15); }
    .graph-mode-btn.active {
      background: var(--accent);
      color: #fff; font-weight: 600;
      box-shadow: 0 0 8px rgba(124,106,247,.4);
    }

    #graph-detail .detail-neighbors {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: .8rem; color: var(--text-dim);
    }

    #graph-detail .detail-neighbors h4 {
      font-size: .78rem; font-weight: 600; color: var(--text-dim);
      margin-bottom: 6px;
    }

    #graph-detail .detail-neighbors ul {
      list-style: none; padding: 0;
    }

    #graph-detail .detail-neighbors li {
      padding: 3px 0;
      cursor: pointer;
      transition: color .15s;
    }

    #graph-detail .detail-neighbors li:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .wrapper { padding: 0 12px; }
      header { padding: 28px 0 18px; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      .header-stats { gap: 16px; }
      .controls { padding: 16px 0 12px; gap: 8px; }
      .search-wrap { flex: 1 1 100%; }
      .view-toggle { order: -1; }
      .filters { gap: 6px; }
      .filter-btn { padding: 6px 12px; font-size: .78rem; }
      #cards-grid { grid-template-columns: 1fr; }
      /* Graph fills viewport below controls */
      #graph-wrapper {
        height: calc(100vh - 24px);
        height: calc(100dvh - 24px);
        min-height: 340px;
        border-radius: var(--radius-sm);
        border: none;
      }

      /* Legend: compact row layout at bottom-left */
      .graph-legend {
        top: auto; bottom: 10px; left: 10px;
        font-size: .68rem; padding: 6px 10px;
        flex-direction: row; flex-wrap: wrap; gap: 4px 10px;
        background: rgba(13,15,23,.92);
        max-width: 220px;
      }

      /* Desktop zoom-hint shrinks on mobile */
      .graph-zoom-hint { font-size: .66rem; padding: 5px 12px; display: none; }

      /* Tooltip narrower on mobile */
      #graph-tooltip { max-width: 260px; display: none !important; }

      /* Detail panel: full-width bottom sheet */
      #graph-detail {
        position: absolute;
        top: auto !important; bottom: 0; right: 0; left: 0;
        width: 100% !important; max-width: 100% !important;
        max-height: 55vh;
        border-radius: var(--radius) var(--radius) 0 0;
        padding: 16px 16px 20px;
        box-shadow: 0 -4px 24px rgba(0,0,0,.5);
        overscroll-behavior: contain;
      }
      #graph-detail .detail-close {
        top: 8px; left: 8px; right: auto;
        font-size: 1.3rem; padding: 6px 10px;
        z-index: 1;
      }

      /* Hide sort in graph view */
      .toolbar.graph-mode { display: none !important; }

      /* Mobile hub-mode hint */
      .graph-hint {
        font-size: .72rem; padding: 5px 10px;
        bottom: 48px; right: 10px;
      }

      .graph-mode-toggle { bottom: 12px; right: 10px; }
      .graph-mode-btn { padding: 4px 12px; font-size: .72rem; }

      /* Bigger tap targets for neighbor list on mobile */
      #graph-detail .detail-neighbors li {
        padding: 8px 4px;
        border-bottom: 1px solid var(--border);
        font-size: .85rem;
      }

      #graph-detail .detail-link {
        display: block; text-align: center;
        padding: 12px 18px; font-size: .9rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- Header -->
    <header>
      <div class="header-inner">
        <div class="logo">
          <div class="logo-icon">🧠</div>
          <div class="logo-text">
            <h1>מאגר ידע AI</h1>
            <p>קישורים, כלים ומחקר — מועשרים בעזרת Claude</p>
          </div>
        </div>
        <div class="header-stats">
          <div class="stat">
            <div class="stat-num" id="total-count">—</div>
            <div class="stat-label">משאבים</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="categories-count">—</div>
            <div class="stat-label">קטגוריות</div>
          </div>
          <div class="stat">
            <div class="stat-num" id="last-updated">—</div>
            <div class="stat-label">עדכון אחרון</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <input
          type="search"
          id="search-input"
          placeholder="חפש לפי שם, תגית, URL..."
          aria-label="חיפוש"
        />
        <span class="search-icon">🔍</span>
      </div>
      <div class="view-toggle" role="tablist" aria-label="תצוגה">
        <button class="view-btn active" data-view="cards" role="tab" aria-selected="true">📇 כרטיסים</button>
        <button class="view-btn" data-view="graph" role="tab" aria-selected="false">🕸️ גרף</button>
      </div>
      <div class="filters" id="filters-bar" role="group" aria-label="סינון לפי קטגוריה">
        <button class="filter-btn active" data-cat="all" id="filter-all">הכל</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <span id="results-count"></span>
      <select id="sort-select" aria-label="מיון">
        <option value="newest">חדש → ישן</option>
        <option value="oldest">ישן → חדש</option>
        <option value="alpha">א–ת</option>
      </select>
    </div>

    <!-- Loading -->
    <div id="loading"><div class="spinner"></div></div>

    <!-- Cards -->
    <div id="cards-grid" role="list" aria-label="רשימת משאבים"></div>

    <!-- Empty state -->
    <div id="empty-state" role="status">
      <div class="empty-icon">🔍</div>
      <h3>לא נמצאו תוצאות</h3>
      <p>נסה מילת חיפוש אחרת או הסר את הסינון</p>
    </div>

    <!-- Graph view -->
    <div id="graph-wrapper">
      <div id="graph-container"></div>
      <div class="graph-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#7c6af7"></div><span>משאב</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#5b8dee"></div><span>תגית</span></div>
        <div class="legend-item"><div class="legend-dot diamond" style="background:#52d9a0"></div><span>קטגוריה</span></div>
      </div>
      <div class="graph-zoom-hint" id="graph-zoom-hint">גלגל לזום · לחץ על צומת לפרטים · גרור לסובב</div>
      <div class="graph-hint" id="graph-hint"></div>
      <div class="graph-mode-toggle" id="graph-mode-toggle">
        <button class="graph-mode-btn" data-gmode="hubs">מרכזים</button>
        <button class="graph-mode-btn active" data-gmode="all">הכל</button>
      </div>
      <div id="graph-detail">
        <div class="detail-drag-handle" aria-hidden="true"></div>
        <button class="detail-close" aria-label="סגור">✕</button>
        <div id="graph-detail-content"></div>
      </div>
    </div>
    <div id="graph-tooltip"></div>

  </div><!-- /wrapper -->

  <footer>
    <div class="wrapper">
      עודכן אוטומטית ע"י
      <a href="https://github.com/Amitro123/knowledgeBase-Agent" target="_blank" rel="noopener">KnowledgeBase Agent</a>
      · מופעל ע"י GitHub Actions + OpenRouter
    </div>
  </footer>

  <script>
    // ── State ────────────────────────────────────────────────────────────
    let allResources = [];
    let activeCategory = 'all';
    let sortOrder = 'newest';
    let searchQuery = '';
    let activeView = 'cards';
    let graphNetwork = null;
    let graphData = { nodes: null, edges: null };
    let graphNodeMap = {};

    function isMobile() { return window.innerWidth <= 600; }

    let graphViewMode = 'all'; // 'hubs' or 'all'
    let focusedHub = null;

    // ── Fetch resources.json ─────────────────────────────────────────────
    async function loadResources() {
      try {
        const res = await fetch('./data/resources.json?_=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allResources = await res.json();
      } catch (err) {
        console.error('Failed to load resources.json:', err);
        allResources = [];
      }

      document.getElementById('loading').style.display = 'none';
      initUI();
    }

    // ── Build category filter buttons ────────────────────────────────────
    function initUI() {
      document.getElementById('total-count').textContent = allResources.length;

      const cats = [...new Set(allResources.map(r => r.category || 'other'))];
      document.getElementById('categories-count').textContent = cats.length;

      if (allResources.length > 0) {
        const latest = allResources.reduce((a, b) =>
          (a.added_at || '') > (b.added_at || '') ? a : b
        );
        document.getElementById('last-updated').textContent =
          latest.added_at ? latest.added_at.slice(5) : '—';
      }

      const bar = document.getElementById('filters-bar');
      const CATEGORY_LABELS = {
        tutorial: '📚 מדריכים',
        tool: '🛠 כלים',
        research: '🔬 מחקר',
        news: '📰 חדשות',
        reference: '📖 עזר',
        community: '👥 קהילה',
        other: '📌 אחר',
        uncategorised: '❓ לא מסווג',
      };

      cats.sort().forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = cat;
        btn.id = `filter-${cat}`;
        btn.textContent = CATEGORY_LABELS[cat] || cat;
        btn.addEventListener('click', () => setCategory(cat));
        bar.appendChild(btn);
      });

      buildGraphData();
      render();
    }

    // ── Category toggle ──────────────────────────────────────────────────
    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      render();
    }

    // ── Filter + sort ────────────────────────────────────────────────────
    function getFiltered() {
      let items = allResources;

      if (activeCategory !== 'all') {
        items = items.filter(r => (r.category || 'other') === activeCategory);
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        items = items.filter(r =>
          (r.title || '').toLowerCase().includes(q) ||
          (r.summary || '').toLowerCase().includes(q) ||
          (r.notes || '').toLowerCase().includes(q) ||
          (r.url || '').toLowerCase().includes(q) ||
          (r.tags || []).some(t => t.toLowerCase().includes(q))
        );
      }

      items = [...items];
      if (sortOrder === 'newest') {
        items.sort((a, b) => (b.added_at || '') > (a.added_at || '') ? 1 : -1);
      } else if (sortOrder === 'oldest') {
        items.sort((a, b) => (a.added_at || '') > (b.added_at || '') ? 1 : -1);
      } else {
        items.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'he'));
      }

      return items;
    }

    // ── Render (dispatches to cards or graph) ────────────────────────────
    function render() {
      if (activeView === 'cards') {
        renderCards();
      } else {
        renderGraph();
      }
    }

    // ── Render cards ─────────────────────────────────────────────────────
    function renderCards() {
      const items = getFiltered();
      const grid = document.getElementById('cards-grid');
      const empty = document.getElementById('empty-state');
      const count = document.getElementById('results-count');

      grid.innerHTML = '';

      if (items.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'flex';
        count.textContent = 'אין תוצאות';
        return;
      }

      grid.style.display = 'grid';
      empty.style.display = 'none';
      count.textContent = `${items.length} משאבים`;

      items.forEach(r => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = r.url || '#';
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.setAttribute('role', 'listitem');
        card.setAttribute('aria-label', r.title || r.url);

        const cat = r.category || 'other';
        const tags = (r.tags || []).slice(0, 5)
          .map(t => `<span class="tag">${escHtml(t)}</span>`).join('');

        const domain = (() => {
          try { return new URL(r.url).hostname.replace('www.', ''); } catch { return r.url || ''; }
        })();

        card.innerHTML = `
          <div class="card-header">
            <div class="card-title">${escHtml(r.title || r.url)}</div>
            <span class="category-badge ${cat}">${escHtml(cat)}</span>
          </div>
          ${r.summary ? `<div class="card-summary">${escHtml(r.summary)}</div>` : ''}
          ${r.notes ? `<div class="card-notes">${escHtml(r.notes)}</div>` : ''}
          ${tags ? `<div class="card-tags">${tags}</div>` : ''}
          <div class="card-footer">
            <span class="card-url">${escHtml(domain)}</span>
            <span>${r.added_at || ''}</span>
          </div>`;

        grid.appendChild(card);
      });
    }

    // ═══════════════════════════════════════════════════════════════════
    // ── Graph logic ──────────────────────────────────────────────────
    // ═══════════════════════════════════════════════════════════════════

    const CATEGORY_COLORS = {
      tutorial:      '#52d9a0',
      tool:          '#7c6af7',
      research:      '#5b8dee',
      news:          '#f7c948',
      reference:     '#f97a6c',
      community:     '#52d9a0',
      other:         '#8892b0',
      uncategorised: '#8892b0',
    };

    const CATEGORY_LABELS_GRAPH = {
      tutorial: 'מדריכים', tool: 'כלים', research: 'מחקר',
      news: 'חדשות', reference: 'עזר', community: 'קהילה',
      other: 'אחר', uncategorised: 'לא מסווג',
    };

    let graphCurrentScale = 1;
    let graphHoveredNode = null;
    let graphSelectedNode = null;
    let graphIsFiltered = false;

    function buildGraphData() {
      const nodes = [];
      const edges = [];
      graphNodeMap = {};

      const tagSet = new Map();
      const catSet = new Map();

      allResources.forEach((r, i) => {
        const cat = r.category || 'other';
        catSet.set(cat, (catSet.get(cat) || 0) + 1);
        (r.tags || []).forEach(t => {
          const tNorm = t.toLowerCase().trim();
          if (tNorm) tagSet.set(tNorm, (tagSet.get(tNorm) || 0) + 1);
        });
      });

      catSet.forEach((count, cat) => {
        const cid = 'c_' + cat;
        graphNodeMap[cid] = { type: 'category', data: { name: cat, count } };
        const catColor = CATEGORY_COLORS[cat] || '#52d9a0';
        nodes.push({
          id: cid,
          label: '  ' + (CATEGORY_LABELS_GRAPH[cat] || cat) + '  ',
          group: 'category',
          shape: 'diamond',
          size: 36 + Math.min(count, 30) * 1,
          mass: 4 + count * 0.2,
          color: { background: catColor, border: catColor + '88', highlight: { background: catColor, border: '#fff8' } },
          font: { color: '#ffffff', size: 40, face: 'Heebo, sans-serif', strokeWidth: 5, strokeColor: '#0d0f17', bold: true, background: 'rgba(13,15,23,0.7)' },
        });
      });

      tagSet.forEach((count, tNorm) => {
        const tid = 't_' + tNorm;
        graphNodeMap[tid] = { type: 'tag', data: { name: tNorm, count } };
        const sz = 14 + Math.min(count, 20) * 1.8;
        const fontSize = 24 + Math.min(count, 10) * 2;
        nodes.push({
          id: tid,
          label: tNorm,
          group: 'tag',
          shape: 'dot',
          size: sz,
          mass: 1.5 + count * 0.1,
          color: { background: '#5b8dee', border: '#7eadff', highlight: { background: '#8dbcff', border: '#b0d4ff' } },
          font: { color: '#c8d4f0', size: fontSize, face: 'Heebo, sans-serif', strokeWidth: 4, strokeColor: '#0d0f17', background: 'rgba(13,15,23,0.55)' },
        });
      });

      allResources.forEach((r, i) => {
        const rid = 'r_' + i;
        const cat = r.category || 'other';
        graphNodeMap[rid] = { type: 'resource', data: r };

        nodes.push({
          id: rid,
          label: '',
          _fullLabel: truncLabel(r.title || r.url, 32),
          group: 'resource',
          shape: 'dot',
          size: 10,
          mass: 1,
          color: { background: '#7c6af7', border: '#9b8aff55', highlight: { background: '#a897ff', border: '#c5bbff' } },
          font: { color: '#e8eaf600', size: 18, face: 'Heebo, sans-serif', strokeWidth: 3, strokeColor: '#0d0f17', background: 'rgba(13,15,23,0.6)' },
        });

        edges.push({
          from: rid, to: 'c_' + cat,
          color: { color: '#2d335240', highlight: '#52d9a0aa', hover: '#52d9a080' },
          width: 1, _type: 'cat',
        });

        (r.tags || []).forEach(t => {
          const tNorm = t.toLowerCase().trim();
          if (!tNorm) return;
          edges.push({
            from: rid, to: 't_' + tNorm,
            color: { color: '#2d335230', highlight: '#5b8deeaa', hover: '#5b8dee80' },
            width: 0.5, _type: 'tag',
          });
        });
      });

      graphData.nodes = new vis.DataSet(nodes);
      graphData.edges = new vis.DataSet(edges);
    }

    function truncLabel(s, max) {
      return s && s.length > max ? s.slice(0, max - 1) + '…' : s || '';
    }

    function updateResourceLabelsForZoom() {
      const showLabels = graphCurrentScale > 1.2;
      const updates = [];
      graphData.nodes.forEach(node => {
        if (node.group !== 'resource') return;
        const wantLabel = showLabels ? (node._fullLabel || '') : '';
        const wantColor = showLabels ? '#d0d4e8' : '#e8eaf600';
        if (node.label !== wantLabel) {
          updates.push({ id: node.id, label: wantLabel, font: { color: wantColor, size: 18, face: 'Heebo, sans-serif', strokeWidth: 3, strokeColor: '#0d0f17', background: 'rgba(13,15,23,0.6)' } });
        }
      });
      if (updates.length) graphData.nodes.update(updates);
    }

    // Hubs = categories plus tags shared by 2+ resources; single-use tags
    // and resources are hidden in hubs mode so the overview stays readable.
    function isHubNode(id) {
      const info = graphNodeMap[id];
      if (!info) return false;
      return info.type === 'category' || (info.type === 'tag' && (info.data.count || 0) >= 2);
    }

    // In hubs mode the resource nodes are hidden but still take part in
    // physics, so a plain fit() zooms out to fit them too. Fit only hubs.
    function fitGraphView(duration = 400) {
      if (!graphNetwork) return;
      const opts = { animation: { duration, easingFunction: 'easeInOutQuad' } };
      if (graphViewMode === 'hubs' && !focusedHub) {
        opts.nodes = graphData.nodes.getIds().filter(isHubNode);
      }
      graphNetwork.fit(opts);
    }

    function initGraph() {
      const container = document.getElementById('graph-container');
      if (graphNetwork) { graphNetwork.destroy(); graphNetwork = null; }

      const mobile = isMobile();

      const options = {
        nodes: { borderWidth: 1.5, scaling: { label: { drawThreshold: 3 } }, shadow: { enabled: !mobile, color: 'rgba(0,0,0,.25)', size: 8, x: 0, y: 2 } },
        edges: { smooth: { type: 'continuous', roundness: 0.25 }, selectionWidth: 2, hoverWidth: mobile ? 0 : 1.5 },
        physics: {
          solver: 'forceAtlas2Based',
          forceAtlas2Based: mobile
            ? { gravitationalConstant: -30, centralGravity: 0.04, springLength: 70, springConstant: 0.06, damping: 0.5 }
            : { gravitationalConstant: -120, centralGravity: 0.005, springLength: 200, springConstant: 0.025, damping: 0.45, avoidOverlap: 0.5 },
          stabilization: { iterations: mobile ? 120 : 280, fit: true },
          maxVelocity: mobile ? 20 : 25,
        },
        interaction: {
          hover: !mobile,
          tooltipDelay: mobile ? 300 : 0,
          zoomView: true,
          dragView: true,
          multiselect: false,
          navigationButtons: false,
          zoomSpeed: mobile ? 0.6 : 1,
          dragNodes: true,
        },
        layout: { improvedLayout: false },
      };

      graphNetwork = new vis.Network(container, graphData, options);

      focusedHub = null;
      updateGraphModeToggle();
      if (graphViewMode === 'hubs') {
        applyHubMode();
        showGraphHint(mobile ? 'לחץ על צומת קטגוריה/תגית לפרטים' : 'לחץ על מרכז להרחבת משאבים');
      } else {
        showGraphHint('גלגל לזום · לחץ על צומת לפרטים · גרר לסובב');
      }

      graphNetwork.on('click', function (params) {
        if (params.nodes.length > 0) {
          const nodeId = params.nodes[0];
          graphSelectedNode = nodeId;
          const info = graphNodeMap[nodeId];

          if (graphViewMode === 'hubs' && !focusedHub && info && (info.type === 'tag' || info.type === 'category')) {
            focusedHub = nodeId;
            expandHub(nodeId);
            showGraphDetail(nodeId);
            return;
          }

          showGraphDetail(nodeId);
          highlightNeighbors(nodeId);
        } else {
          graphSelectedNode = null;
          hideGraphDetail();
          if (graphViewMode === 'hubs' && focusedHub) {
            focusedHub = null;
            applyHubMode();
          } else if (!graphIsFiltered) {
            resetHighlight();
          } else {
            applyGraphFilter();
          }
        }
      });

      graphNetwork.on('doubleClick', function (params) {
        if (params.nodes.length > 0) {
          const nodeId = params.nodes[0];
          const info = graphNodeMap[nodeId];
          if (info && info.type === 'resource' && info.data.url) {
            window.open(info.data.url, '_blank', 'noopener');
          }
        }
      });

      graphNetwork.on('hoverNode', function (params) {
        graphHoveredNode = params.node;
        showTooltip(params.node, params.event.center);
        if (!graphSelectedNode) highlightNeighbors(params.node);
        showHoveredResourceLabel(params.node, true);
      });

      graphNetwork.on('blurNode', function (params) {
        graphHoveredNode = null;
        hideTooltip();
        showHoveredResourceLabel(params.node, false);
        if (!graphSelectedNode) {
          if (graphIsFiltered) applyGraphFilter();
          else resetHighlight();
        }
      });

      graphNetwork.on('zoom', function (params) {
        graphCurrentScale = params.scale;
        updateResourceLabelsForZoom();
        const hint = document.getElementById('graph-zoom-hint');
        if (hint) hint.style.opacity = params.scale > 0.5 ? '0' : '1';
      });

      graphNetwork.on('stabilizationIterationsDone', function () {
        fitGraphView(400);
      });

      container.addEventListener('mousemove', function (e) {
        if (graphHoveredNode) positionTooltip(e.clientX, e.clientY);
      });
    }

    function showHoveredResourceLabel(nodeId, show) {
      const node = graphData.nodes.get(nodeId);
      if (!node || node.group !== 'resource') return;
      if (graphCurrentScale > 1.2) return;
      graphData.nodes.update({
        id: nodeId,
        label: show ? (node._fullLabel || '') : '',
        font: { color: show ? '#e8eaf6' : '#e8eaf600', size: 18, face: 'Heebo, sans-serif', strokeWidth: 3, strokeColor: '#0d0f17', background: show ? 'rgba(13,15,23,0.7)' : 'transparent' },
      });
    }

    function showTooltip(nodeId, center) {
      const info = graphNodeMap[nodeId];
      if (!info) return;
      const tt = document.getElementById('graph-tooltip');
      let html = '';

      if (info.type === 'resource') {
        const r = info.data;
        const tags = (r.tags || []).slice(0, 4).map(t => `<span>${escHtml(t)}</span>`).join('');
        html = `<div class="tt-type resource">משאב</div>
          <div class="tt-title">${escHtml(r.title || r.url)}</div>
          ${r.summary ? `<div class="tt-summary">${escHtml(r.summary)}</div>` : ''}
          ${tags ? `<div class="tt-tags">${tags}</div>` : ''}`;
      } else if (info.type === 'tag') {
        html = `<div class="tt-type tag">תגית</div>
          <div class="tt-title">${escHtml(info.data.name)}</div>
          <div class="tt-count">${info.data.count} משאבים מקושרים</div>`;
      } else if (info.type === 'category') {
        html = `<div class="tt-type category">קטגוריה</div>
          <div class="tt-title">${escHtml(CATEGORY_LABELS_GRAPH[info.data.name] || info.data.name)}</div>
          <div class="tt-count">${info.data.count} משאבים</div>`;
      }

      tt.innerHTML = html;
      tt.style.display = 'block';
      if (center) positionTooltip(center.x, center.y);
    }

    function positionTooltip(cx, cy) {
      const tt = document.getElementById('graph-tooltip');
      const pad = 14;
      const ttW = tt.offsetWidth;
      const ttH = tt.offsetHeight;
      let x = cx + pad;
      let y = cy + pad;
      if (x + ttW > window.innerWidth - 8) x = cx - ttW - pad;
      if (y + ttH > window.innerHeight - 8) y = cy - ttH - pad;
      tt.style.left = x + 'px';
      tt.style.top = y + 'px';
    }

    function hideTooltip() {
      document.getElementById('graph-tooltip').style.display = 'none';
    }

    function showGraphHint(text) {
      const hint = document.getElementById('graph-hint');
      if (!hint) return;
      hint.textContent = text;
      hint.style.opacity = '1';
      clearTimeout(hint._timer);
      hint._timer = setTimeout(() => { hint.style.opacity = '0'; }, 5000);
    }

    function applyHubMode() {
      if (!graphData.nodes) return;
      const mobile = isMobile();
      const nodeUpdates = graphData.nodes.getIds().map(id => {
        const info = graphNodeMap[id];
        if (!info) return { id };
        if (!isHubNode(id)) {
          return { id, hidden: true };
        }
        const isCategory = info.type === 'category';
        const catColor = isCategory ? (CATEGORY_COLORS[info.data.name] || '#52d9a0') : '#5b8dee';
        const countBoost = Math.min((info.data.count || 0), 15);
        return {
          id,
          hidden: false,
          opacity: 1,
          borderWidth: 1.5,
          size: isCategory
            ? (mobile ? 44 : 38 + countBoost)
            : (mobile ? 22 : 20 + countBoost * 1.2),
          color: { background: catColor, border: catColor + '88', highlight: { background: catColor, border: '#fff8' } },
          font: {
            color: '#e8eaf6',
            size: isCategory
              ? (mobile ? 46 : 30)
              : (mobile ? 28 : 18 + Math.min((info.data.count || 0), 10) * 1.2),
            face: 'Heebo, sans-serif',
            strokeWidth: 4,
            strokeColor: '#0d0f17',
            background: mobile ? 'transparent' : 'rgba(13,15,23,0.55)',
          },
        };
      });
      graphData.nodes.update(nodeUpdates);

      const edgeUpdates = graphData.edges.getIds().map(id => ({ id, hidden: true }));
      graphData.edges.update(edgeUpdates);

      fitGraphView(300);
    }

    function updateGraphModeToggle() {
      const toggle = document.getElementById('graph-mode-toggle');
      if (!toggle) return;
      toggle.style.display = 'flex';
      toggle.querySelectorAll('.graph-mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.gmode === graphViewMode);
      });
    }

    function setGraphViewMode(mode) {
      if (mode === graphViewMode) return;
      graphViewMode = mode;
      focusedHub = null;
      graphSelectedNode = null;
      hideGraphDetail();
      updateGraphModeToggle();

      if (mode === 'hubs') {
        applyHubMode();
        showGraphHint(isMobile() ? 'לחץ על צומת קטגוריה/תגית לפרטים' : 'לחץ על מרכז להרחבת משאבים');
      } else {
        resetHighlight();
        showGraphHint('גלגל לזום · לחץ על צומת לפרטים · גרר לסובב');
      }
    }

    function expandHub(hubId) {
      const neighbors = graphNetwork.getConnectedNodes(hubId);
      const connectedEdges = graphNetwork.getConnectedEdges(hubId);
      const neighborSet = new Set([hubId, ...neighbors]);
      const mobile = isMobile();
      const hubInfo = graphNodeMap[hubId];
      const hubColor = hubInfo && hubInfo.type === 'category'
        ? (CATEGORY_COLORS[hubInfo.data.name] || '#52d9a0') : '#5b8dee';

      const nodeUpdates = graphData.nodes.getIds().map(id => {
        const info = graphNodeMap[id];
        if (!info) return { id };
        if (neighborSet.has(id)) {
          const isHub = info.type === 'tag' || info.type === 'category';
          const isSelected = id === hubId;
          const isResource = info.type === 'resource';
          const node = graphData.nodes.get(id);
          return {
            id,
            hidden: false,
            opacity: 1,
            size: isSelected ? (mobile ? 28 : 44) : (isHub ? (mobile ? 16 : 26) : (mobile ? 10 : 14)),
            borderWidth: isSelected ? 3 : 1.5,
            color: isSelected
              ? { background: hubColor, border: '#ffffff', highlight: { background: hubColor, border: '#ffffff' } }
              : undefined,
            label: isResource ? (node._fullLabel || '') : node.label,
            font: {
              color: '#e8eaf6',
              size: isSelected ? (mobile ? 14 : 26) : (isHub ? (mobile ? 12 : 18) : (mobile ? 10 : 15)),
              face: 'Heebo, sans-serif',
              strokeWidth: mobile ? 0 : 3,
              strokeColor: '#0d0f17',
              background: mobile ? 'transparent' : 'rgba(13,15,23,0.55)',
            },
          };
        }
        if (!isHubNode(id)) {
          return { id, hidden: true };
        }
        return { id, hidden: false, opacity: 0.12, font: { color: '#e8eaf615' } };
      });
      graphData.nodes.update(nodeUpdates);

      const connectedEdgeSet = new Set(connectedEdges);
      const edgeUpdates = graphData.edges.getIds().map(id => {
        const isConn = connectedEdgeSet.has(id);
        return {
          id,
          hidden: !isConn,
          opacity: isConn ? 0.85 : 0.03,
          width: isConn ? 2 : 0.3,
        };
      });
      graphData.edges.update(edgeUpdates);

      graphNetwork.focus(hubId, {
        scale: mobile ? 1.0 : 1.2,
        animation: { duration: 400, easingFunction: 'easeInOutQuad' },
      });

      showGraphHint(mobile ? 'לחץ על משאב לפרטים · לחץ על רקע לחזור' : 'לחץ על משאב לפרטים · רקע לחזור');
    }

    function highlightNeighbors(nodeId) {
      const connectedNodes = graphNetwork.getConnectedNodes(nodeId);
      const connectedEdges = graphNetwork.getConnectedEdges(nodeId);
      const allNodeIds = graphData.nodes.getIds();
      const allEdgeIds = graphData.edges.getIds();

      const highlightSet = new Set([nodeId, ...connectedNodes]);
      const selectedInfo = graphNodeMap[nodeId];

      const nodeUpdates = allNodeIds.map(id => {
        const isHL = highlightSet.has(id);
        const isSelected = id === nodeId;
        const info = graphNodeMap[id];
        const isResource = info && info.type === 'resource';
        const isTag = info && info.type === 'tag';
        const isCat = info && info.type === 'category';
        const node = graphData.nodes.get(id);
        const baseFontSize = isResource ? 18 : (isCat ? 40 : (24 + Math.min((info?.data?.count || 0), 10) * 2));
        const baseSize = isResource ? 10 : (isCat ? (36 + Math.min((info?.data?.count || 0), 30)) : (14 + Math.min((info?.data?.count || 0), 20) * 1.8));

        if (!isHL) {
          return {
            id,
            opacity: 0.05,
            size: baseSize,
            borderWidth: 1.5,
            label: isResource ? '' : node.label,
            font: { color: '#e8eaf605', size: baseFontSize, face: 'Heebo, sans-serif', strokeWidth: 0, strokeColor: '#0d0f17', background: 'transparent' },
          };
        }

        const sizeBoost = isSelected ? 1.35 : 1;
        let fontColor = isCat ? '#ffffff' : (isTag ? '#c8d4f0' : '#e8eaf6');
        let label = node.label;
        if (isResource && isHL) label = node._fullLabel || '';

        const update = {
          id,
          opacity: 1,
          size: Math.round(baseSize * sizeBoost),
          borderWidth: isSelected ? 3.5 : 1.5,
          label,
          font: {
            color: fontColor,
            size: isSelected ? Math.round(baseFontSize * 1.1) : baseFontSize,
            face: 'Heebo, sans-serif',
            strokeWidth: isHL ? (isCat ? 5 : 3) : 0,
            strokeColor: '#0d0f17',
            background: isHL ? (isCat ? 'rgba(13,15,23,0.7)' : 'rgba(13,15,23,0.55)') : 'transparent',
            bold: isSelected,
          },
        };

        if (isSelected) {
          const nodeColor = isResource ? '#a897ff' : (isCat ? (CATEGORY_COLORS[info.data.name] || '#52d9a0') : '#8dbcff');
          update.color = { background: nodeColor, border: '#ffffff', highlight: { background: nodeColor, border: '#ffffff' } };
        }

        return update;
      });

      const edgeUpdates = allEdgeIds.map(id => {
        const isConn = connectedEdges.includes(id);
        const edge = graphData.edges.get(id);
        return {
          id,
          opacity: isConn ? 1 : 0.02,
          width: isConn ? 2.5 : 0.3,
          color: isConn
            ? { color: edge._type === 'cat' ? '#52d9a0bb' : '#5b8deebb', highlight: edge._type === 'cat' ? '#52d9a0' : '#5b8dee' }
            : edge.color,
        };
      });

      graphData.nodes.update(nodeUpdates);
      graphData.edges.update(edgeUpdates);
    }

    function resetHighlight() {
      if (graphViewMode === 'hubs' && !focusedHub) {
        applyHubMode();
        return;
      }

      const showLabels = graphCurrentScale > 1.2;
      const nodeUpdates = graphData.nodes.getIds().map(id => {
        const info = graphNodeMap[id];
        const isResource = info && info.type === 'resource';
        const isTag = info && info.type === 'tag';
        const isCat = info && info.type === 'category';
        const fontSize = isResource ? 18 : (isCat ? 40 : (24 + Math.min((info?.data?.count || 0), 10) * 2));
        const baseSize = isResource ? 10 : (isCat ? (36 + Math.min((info?.data?.count || 0), 30)) : (14 + Math.min((info?.data?.count || 0), 20) * 1.8));
        const catColor = isCat ? (CATEGORY_COLORS[info.data.name] || '#52d9a0') : '#5b8dee';
        return {
          id,
          hidden: false,
          opacity: 1,
          size: baseSize,
          borderWidth: 1.5,
          color: isResource
            ? { background: '#7c6af7', border: '#9b8aff55', highlight: { background: '#a897ff', border: '#c5bbff' } }
            : (isCat
              ? { background: catColor, border: catColor + '88', highlight: { background: catColor, border: '#fff8' } }
              : { background: '#5b8dee', border: '#7eadff', highlight: { background: '#8dbcff', border: '#b0d4ff' } }),
          label: isResource ? (showLabels ? (graphData.nodes.get(id)._fullLabel || '') : '') : graphData.nodes.get(id).label,
          font: {
            color: isResource ? (showLabels ? '#d0d4e8' : '#e8eaf600') : (isTag ? '#c8d4f0' : '#ffffff'),
            size: fontSize,
            face: 'Heebo, sans-serif',
            strokeWidth: isResource && !showLabels ? 0 : (isCat ? 5 : 4),
            strokeColor: '#0d0f17',
            background: isResource && !showLabels ? 'transparent' : (isCat ? 'rgba(13,15,23,0.7)' : 'rgba(13,15,23,0.55)'),
            bold: false,
          },
        };
      });

      const edgeUpdates = graphData.edges.getIds().map(id => {
        const edge = graphData.edges.get(id);
        return {
          id,
          hidden: false,
          opacity: 1,
          width: edge._type === 'cat' ? 1 : 0.5,
          color: edge._type === 'cat'
            ? { color: '#2d335240', highlight: '#52d9a0aa', hover: '#52d9a080' }
            : { color: '#2d335230', highlight: '#5b8deeaa', hover: '#5b8dee80' },
        };
      });

      graphData.nodes.update(nodeUpdates);
      graphData.edges.update(edgeUpdates);
    }

    function showGraphDetail(nodeId) {
      const info = graphNodeMap[nodeId];
      if (!info) return;

      const panel = document.getElementById('graph-detail');
      const content = document.getElementById('graph-detail-content');
      const mobile = isMobile();

      const neighbors = graphNetwork.getConnectedNodes(nodeId);
      const neighborHtml = neighbors.map(nid => {
        const nInfo = graphNodeMap[nid];
        if (!nInfo) return '';
        const label = nInfo.type === 'resource' ? (nInfo.data.title || nInfo.data.url) :
                      nInfo.type === 'category' ? (CATEGORY_LABELS_GRAPH[nInfo.data.name] || nInfo.data.name) :
                      nInfo.data.name || nid;
        return `<li data-nid="${escHtml(nid)}">${escHtml(label)}</li>`;
      }).join('');

      if (info.type === 'resource') {
        const r = info.data;
        const tags = (r.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
        content.innerHTML = `
          <div class="detail-type resource">משאב</div>
          <h3>${escHtml(r.title || r.url)}</h3>
          ${r.summary ? `<div class="detail-summary">${escHtml(r.summary)}</div>` : ''}
          ${r.notes ? `<div class="detail-notes">${escHtml(r.notes)}</div>` : ''}
          ${r.category ? `<div class="detail-meta">קטגוריה: ${escHtml(CATEGORY_LABELS_GRAPH[r.category] || r.category)}</div>` : ''}
          ${r.added_at ? `<div class="detail-meta">נוסף: ${escHtml(r.added_at)}</div>` : ''}
          ${tags ? `<div class="detail-tags">${tags}</div>` : ''}
          ${r.url ? `<a class="detail-link" href="${escHtml(r.url)}" target="_blank" rel="noopener">פתח קישור ↗</a>` : ''}
          ${neighborHtml ? `<div class="detail-neighbors"><h4>קשרים (${neighbors.length})</h4><ul>${neighborHtml}</ul></div>` : ''}`;
      } else if (info.type === 'tag') {
        const resourceNeighbors = neighbors.filter(nid => graphNodeMap[nid]?.type === 'resource');
        content.innerHTML = `
          <div class="detail-type tag">תגית</div>
          <h3>${escHtml(info.data.name)}</h3>
          <div class="detail-summary">${resourceNeighbors.length} משאבים מקושרים</div>
          ${neighborHtml ? `<div class="detail-neighbors"><h4>משאבים</h4><ul>${neighborHtml}</ul></div>` : ''}`;
      } else if (info.type === 'category') {
        const resourceNeighbors = neighbors.filter(nid => graphNodeMap[nid]?.type === 'resource');
        content.innerHTML = `
          <div class="detail-type category">קטגוריה</div>
          <h3>${escHtml(CATEGORY_LABELS_GRAPH[info.data.name] || info.data.name)}</h3>
          <div class="detail-summary">${resourceNeighbors.length} משאבים</div>
          ${neighborHtml ? `<div class="detail-neighbors"><h4>משאבים</h4><ul>${neighborHtml}</ul></div>` : ''}`;
      }

      panel.style.display = 'block';

      if (mobile) {
        panel.scrollTop = 0;
      }

      content.querySelectorAll('.detail-neighbors li[data-nid]').forEach(li => {
        li.addEventListener('click', () => {
          const nid = li.dataset.nid;
          graphSelectedNode = nid;
          const nInfo = graphNodeMap[nid];
          if (graphViewMode === 'hubs' && nInfo && nInfo.type === 'resource') {
            showGraphDetail(nid);
            return;
          }
          graphNetwork.selectNodes([nid]);
          graphNetwork.focus(nid, { scale: mobile ? 0.9 : 1.5, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
          showGraphDetail(nid);
          highlightNeighbors(nid);
        });
      });
    }

    function hideGraphDetail() {
      document.getElementById('graph-detail').style.display = 'none';
    }

    function applyGraphFilter() {
      const filteredItems = getFiltered();
      const filteredIds = new Set(filteredItems.map(r => {
        const idx = allResources.indexOf(r);
        return 'r_' + (idx >= 0 ? idx : 0);
      }));
      const count = document.getElementById('results-count');

      graphIsFiltered = !(filteredItems.length === allResources.length && !searchQuery);

      if (!graphIsFiltered) {
        resetHighlight();
        count.textContent = `${graphData.nodes.getIds().length} צמתים`;
        fitGraphView(400);
        return;
      }

      const connectedTags = new Set();
      const connectedCats = new Set();
      filteredItems.forEach(r => {
        connectedCats.add('c_' + (r.category || 'other'));
        (r.tags || []).forEach(t => connectedTags.add('t_' + t.toLowerCase().trim()));
      });

      const visibleSet = new Set([...filteredIds, ...connectedTags, ...connectedCats]);
      const showResourceLabels = filteredItems.length <= 20;

      const nodeUpdates = graphData.nodes.getIds().map(id => {
        const isVis = visibleSet.has(id);
        const info = graphNodeMap[id];
        const isResource = info && info.type === 'resource';
        const isTag = info && info.type === 'tag';
        const isCat = info && info.type === 'category';
        const fontSize = isResource ? 18 : (isCat ? 40 : (24 + Math.min((info?.data?.count || 0), 10) * 2));
        let label = graphData.nodes.get(id).label;
        let fontColor;

        if (isVis) {
          fontColor = isResource ? (showResourceLabels ? '#d0d4e8' : '#e8eaf600') : (isTag ? '#c8d4f0' : '#ffffff');
          if (isResource && showResourceLabels) label = graphData.nodes.get(id)._fullLabel || '';
          else if (isResource && !showResourceLabels) label = '';
        } else {
          fontColor = '#e8eaf605';
          if (isResource) label = '';
        }

        return {
          id,
          opacity: isVis ? 1 : 0.04,
          label,
          font: {
            color: fontColor,
            size: fontSize,
            face: 'Heebo, sans-serif',
            strokeWidth: isVis ? (isCat ? 5 : 3) : 0,
            strokeColor: '#0d0f17',
            background: isVis ? (isCat ? 'rgba(13,15,23,0.7)' : (isResource && !showResourceLabels ? 'transparent' : 'rgba(13,15,23,0.55)')) : 'transparent',
          },
        };
      });

      const edgeUpdates = graphData.edges.getIds().map(id => {
        const edge = graphData.edges.get(id);
        const show = filteredIds.has(edge.from) || filteredIds.has(edge.to);
        return { id, opacity: show ? 0.9 : 0.02, width: show ? 1.5 : 0.3 };
      });

      graphData.nodes.update(nodeUpdates);
      graphData.edges.update(edgeUpdates);
      count.textContent = `${filteredItems.length} משאבים (מסוננים)`;

      const visibleNodeIds = [...visibleSet];
      if (visibleNodeIds.length > 0 && visibleNodeIds.length < graphData.nodes.length) {
        graphNetwork.fit({ nodes: visibleNodeIds, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
      }
    }

    function renderGraph() {
      if (!graphNetwork) initGraph();
      applyGraphFilter();
      if (graphViewMode === 'hubs' && !focusedHub) {
        applyHubMode();
      }
    }

    // ── View switching ───────────────────────────────────────────────────
    function switchView(view) {
      activeView = view;
      const cardsGrid = document.getElementById('cards-grid');
      const graphWrapper = document.getElementById('graph-wrapper');
      const toolbar = document.querySelector('.toolbar');
      const emptyState = document.getElementById('empty-state');

      document.querySelectorAll('.view-btn').forEach(b => {
        const isActive = b.dataset.view === view;
        b.classList.toggle('active', isActive);
        b.setAttribute('aria-selected', isActive);
      });

      if (view === 'cards') {
        graphWrapper.style.display = 'none';
        cardsGrid.style.display = '';
        toolbar.style.display = '';
        toolbar.classList.remove('graph-mode');
        emptyState.style.display = '';
        hideGraphDetail();
        renderCards();
      } else {
        cardsGrid.style.display = 'none';
        emptyState.style.display = 'none';
        toolbar.style.display = 'flex';
        toolbar.classList.add('graph-mode');
        graphWrapper.style.display = 'block';

        if (!graphNetwork) {
          graphViewMode = isMobile() ? 'hubs' : 'all';
        }
        focusedHub = null;
        renderGraph();
        if (isMobile()) {
          graphWrapper.scrollIntoView({ block: 'start' });
        }
      }
    }

    // ── Utils ────────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Event listeners ──────────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      render();
    });

    document.getElementById('filter-all').addEventListener('click', () => setCategory('all'));

    document.getElementById('sort-select').addEventListener('change', e => {
      sortOrder = e.target.value;
      render();
    });

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    document.querySelector('#graph-detail .detail-close').addEventListener('click', () => {
      hideGraphDetail();
      graphSelectedNode = null;
      resetHighlight();
    });

    document.querySelectorAll('.graph-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => setGraphViewMode(btn.dataset.gmode));
    });

    // ── Reinit graph on orientation / resize change ─────────────────────
    let _lastMobile = isMobile();
    window.addEventListener('resize', () => {
      const mobile = isMobile();
      if (mobile !== _lastMobile && activeView === 'graph' && graphNetwork) {
        _lastMobile = mobile;
        graphViewMode = mobile ? 'hubs' : 'all';
        graphNetwork.destroy();
        graphNetwork = null;
        renderGraph();
      }
      _lastMobile = mobile;
    });

    // ── Init ─────────────────────────────────────────────────────────────
    loadResources();
  </script>
</body>
</html>
